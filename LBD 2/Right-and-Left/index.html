/* ===================== Game flow ===================== */
let reuseColors=false;
let colorBag=[], lastOut=null;    // the colour that sits OUT each level, drawn from a shuffled bag
function pickColors(){            // choose two distinct house colours and show the houses
  // FAIR rotation: pick the colour to leave out from a bag of all three, refilled+reshuffled
  // when empty — every colour sits out exactly once per 3 levels, so no colour can streak
  if(!colorBag.length){
    colorBag=["red","blue","yellow"];
    for(let i=colorBag.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [colorBag[i],colorBag[j]]=[colorBag[j],colorBag[i]]; }
  }
  let out=colorBag.pop();
  if(out===lastOut && colorBag.length){          // never the same colour sitting out twice running —
    const alt=colorBag.pop(); colorBag.push(out); out=alt;   // a RETRIED level must deal a visibly new pair
  }
  lastOut=out;
  const pool=["red","blue","yellow"].filter(c=>c!==out);
  if(Math.random()<0.5) pool.reverse();          // sides still random
  if(pool[0]===leftColor && pool[1]===rightColor) pool.reverse();   // …but never the exact same left/right deal twice in a row
  leftColor=pool[0]; rightColor=pool[1]; closeHouses();
}

/* ---- background music: the FULL track, looped for the whole game, gently ducked under voice-over ----
   iOS/iPadOS Safari IGNORES writes to HTMLMediaElement.volume, so on tablets the track played
   at FULL gain and buried every VO line no matter what rampMusic asked for. The level therefore
   goes through a Web Audio GainNode (wired in ensureAudio()); el.volume stays only as the
   no-Web-Audio fallback, and musicLevel tracks the value we asked for (bgm.volume can't be
   trusted as a readback once the gain node owns the level). */
const MUSIC_VOL = 0.18, MUSIC_DUCK = 0.05;        // clearly hearable; dips under a VO line
const bgm = new Audio("Audio/BackgroundMusic.ogg");
bgm.loop = true; bgm.preload = "auto";
let musicOn=false, musicRamp=null, musicLevel=0, bgmGain=null;
function setMusicLevel(v){
  musicLevel=Math.max(0, Math.min(1, v));
  if(bgmGain){ try{ bgmGain.gain.value=musicLevel; }catch(e){} }
  else { try{ bgm.volume=musicLevel; }catch(e){} }
}
function rampMusic(target, sec){                   // smooth volume glide — never a sudden jump
  if(musicRamp){ clearInterval(musicRamp); musicRamp=null; }
  const from=musicLevel, t0=performance.now();
  musicRamp=setInterval(()=>{
    const k=Math.min(1,(performance.now()-t0)/(sec*1000));
    setMusicLevel(from+(target-from)*k);
    if(k>=1){ clearInterval(musicRamp); musicRamp=null; if(target<=0.005 && !musicOn) bgm.pause(); }
  }, 50);
}
function startMusic(){
  if(musicOn) return; musicOn=true;
  setMusicLevel(0.001);
  try{ const p=bgm.play(); if(p&&p.catch) p.catch(()=>{}); }catch(e){}
  rampMusic(MUSIC_VOL, 1.4);                             // gentle fade-in
}
function stopMusic(){
  if(!musicOn) return; musicOn=false;
  rampMusic(0.001, 0.5);                            // fades out, then pauses
}

const welcomeEl=$("welcome");
async function welcomeThenStart(){        // Play pressed → clouds reveal the PLAYSCREEN blurred under the Figma title, then unblur into the level
  if(busy) return;
  if(runActive){ location.reload(); return; }   // a round is mid-flight (e.g. start screen re-shown over it) — restart clean, never layer a second game loop
  busy=true;
  showButtons(false); hideBubble(); hideParcel(); hideDog();
  await cloudTransition("", ()=>{
    startScreen.classList.add("hide"); endScreen.classList.add("hide"); gameScreen.classList.remove("hide");
    try{ endVideo.pause(); }catch(e){}            // don't keep the end video decoding behind the game
    startMusic();                                 // soft background music
    loadLevel(START_LVL);                         // (re)build the first level's map — replay starts over
    pickColors();                                 // set up the level-1 houses
    setByte("backParcel", feetOf(WP.start).x, FRAME.H+260);   // Byte waits just below the bottom of the frame
    // The map is revealed already blurred (title still hidden). Deferred one frame: the 14px
    // full-screen backdrop blur is its own expensive paint, and stacked onto the same frame as
    // the screen swap it pushed tablets over budget mid-sweep. The clouds hold cover for
    // ~900ms after this callback, so the blur still lands long before anything is visible.
    requestAnimationFrame(()=>welcomeEl.classList.add("show"));
  });
  welcomeEl.classList.add("lines");               // clouds have parted — NOW the two title lines pop in, one after the other
  voSay("help-byte").then(()=>voSay("deliver-the-parcels"));   // voiced in step with the two lines
  await sleep(3000);                              // let both lines land and the moment breathe
  welcomeEl.classList.remove("show","lines");     // un-blur into the level
  await sleep(500);
  busy=false;
  startGame();
}
function startGame(){
  runActive=true;                                 // a run is now in flight — Play must reload, not re-enter
  score=0; round=0; routeState=[];                // fresh run → an empty route board
  introSequence();
}

async function introSequence(){
  busy=true;
  const sf=feetOf(WP.start);
  await moveByte("backParcel", sf.x, sf.y, false);      // walks in from the bottom — keeps rolling straight into the approach

  reuseColors=true; busy=false;
  nextRound();
}

async function nextRound(li){
  if(li==null) li=levelIdx;
  round++;
  busy=true; stopLook(); showButtons(false); hideBubble(); hideParcel(); hideDog(); hideHeadPop();
  const prep=()=>{   // scene reset — build this level's map, new colours, Byte back at the start
    routeHide();                                     // the board hands over under cover of the clouds
    loadLevel(li);
    // pick two distinct house colours (level 1 reuses the colours shown in the intro)
    if(reuseColors){ reuseColors=false; } else { pickColors(); }
    target = Math.random()<0.5 ? "left" : "right";
    targetColor = target==="left" ? leftColor : rightColor;
    const sf=feetOf(WP.start);
    if(round>1) setByte("backParcel", sf.x, sf.y);     // level 1: Byte has just WALKED to this exact spot — re-stamping
  };                                             // him would swap to the static frame and stall the entrance
  if(round>1) await cloudTransition("", prep);   // clouds sweep the old level away, the new map is ready underneath (no label)
  else prep();                                   // level 1: the intro clouds have just parted — no extra curtain
  if(round>1) await sleep(400);                  // level 1 flows straight from the walk-in into the approach
  await playLevel();
}

/* =====================  Interactive level flow  =====================
   Vertical movement runs on its own; EVERY horizontal turn is the player's call.
   ONE instruction panel per level: it appears at the FIRST turning point
   ("Help Byte deliver the parcel to the … house.") and stays up through the
   level's choosing flow. Buttons pop under it at every turn.
   - Single-road turns (only one way has road): a wrong pick gets a gentle
     "no road that way" and the question comes back — you can't walk into grass.
   - The deciding turn (a road each way): a wrong house means the bark scene,
     then the SAME level replays with fresh colours — every parcel must be
     delivered before the run can move on. */
let pendingPick=null, autoAnswer=null;
function awaitPick(){ return new Promise(res=>{ pendingPick=res; showButtons(true); busy=false; startIdleHint(); }); }

/* idle nudge — 5s without an answer: on LEVEL 1 the CORRECT button pulses (guided first go);
   on later levels BOTH buttons pop one after the other ("pick one!") without giving it away. */
let idleT=null, idleI=null;
function startIdleHint(){
  stopIdleHint();
  idleT=setTimeout(()=>{
    if(levelIdx===0){
      ((autoAnswer||target)==="left" ? leftBtn : rightBtn).classList.add("hint");
    } else {
      let onLeft=true;
      const step=()=>{ leftBtn.classList.toggle("hint",onLeft); rightBtn.classList.toggle("hint",!onLeft); onLeft=!onLeft; };
      step(); idleI=setInterval(step, 1600);   // matches one full btnHint cycle — each button finishes its pulse before handing off
    }
  }, 5000);
}
function stopIdleHint(){
  clearTimeout(idleT); if(idleI) clearInterval(idleI); idleT=idleI=null;
  leftBtn.classList.remove("hint"); rightBtn.classList.remove("hint");
}

async function playLevel(){
  busy=true;
  let instructed=false, looked=false;   // looked: the quick both-ways glance plays at this level's FIRST turn only
  const instruct=async()=>{                    // the one persistent panel for this level
    sayHold("Deliver to the "+colorWord(targetColor)+" house");
    if(!instructed){ instructed=true; await voSay("deliver-"+targetColor); }   // buttons wait for the line — kids hear the target before choosing
  };
  const askAt=async(hint)=>{                   // stop at a turning point: settle, look both ways, panel, buttons
    await sleep(350);
    await lookBothWays(!looked); looked=true;  // first turn of the level glances both ways; retries & later turns skip it
    await instruct();
    autoAnswer = hint||null;                   // lets the ?auto= test driver pass single-road turns
    const side = await awaitPick();
    autoAnswer = null;
    stopLook();
    return side;
  };
  const gate=async(correct)=>{                 // single-road turn — the road only goes ONE way
    for(;;){
      const side = await askAt(correct);
      if(side===correct) return;
      setByte(side==="left"?"leftParcel":"rightParcel", lastFootX, lastFootY);   // he looks that way…
      say("Oops! No road that way!"); await voSay("no-road");
      await sleep(600);
      setByte("backParcel", lastFootX, lastFootY);   // …shakes it off, and the question comes back
      await instruct();
    }
  };
  const walkLeg=async(to,dir,settle=true)=>{   // one horizontal leg, with the "Moving left/right!" VO
    voSay(dir==="left" ? "moving-left" : "moving-right");
    setByte(dir+"Parcel", lastFootX, lastFootY);   // turn the chosen way, carrying the parcel
    await sleep(350);
    await moveByte(dir+"Parcel", to.x, to.y, settle);
  };
  const stepTo=async(names, i, correct)=>{     // walk one path leg; horizontal turns (after the first) ask again
    const to=feetOf(WP[names[i]]), dx=to.x-lastFootX, dy=to.y-lastFootY;
    if(Math.hypot(dx,dy)<2) return;
    const vertical = Math.abs(dy)>=Math.abs(dx);
    // look ahead — if the NEXT leg carries straight on the same way (and won't stop to ask),
    // roll through the joint: no static-frame swap, no beat, so Byte never stalls mid-road
    let through=false;
    if(i+1<names.length){
      const nx=feetOf(WP[names[i+1]]), ndx=nx.x-to.x, ndy=nx.y-to.y;
      if(Math.hypot(ndx,ndy)>=2){
        const nvert = Math.abs(ndy)>=Math.abs(ndx);
        if(vertical) through = nvert;
        else through = !nvert && ((ndx<0)===(dx<0)) && !correct;  // correct-road horizontal turns ask again → they stop anyway
      }
    }
    if(vertical){ await moveByte("backParcel", to.x, to.y, !through); }   // y-axis: on its own
    else {
      const dir = dx<0 ? "left" : "right";
      if(i>0 && correct) await gate(dir);      // a later turn on the chosen road — ask again
      await walkLeg(to, dir, !through);
    }
    if(!through) await sleep(120);
  };

  // --- approach: up on his own; every horizontal turn on the way is the player's call
  const ap=LEVEL.paths.approach;
  for(let i=0;i<ap.length;i++){
    const to=feetOf(WP[ap[i]]), dx=to.x-lastFootX, dy=to.y-lastFootY;
    if(Math.abs(dy)>=Math.abs(dx)){
      // roll straight through when the next approach leg is also vertical — no mid-road stall
      let through=false;
      if(i+1<ap.length){
        const nx=feetOf(WP[ap[i+1]]), ndx=nx.x-to.x, ndy=nx.y-to.y;
        through = Math.hypot(ndx,ndy)>=2 && Math.abs(ndy)>=Math.abs(ndx);
      }
      await moveByte("backParcel", to.x, to.y, !through);
      if(!through) await sleep(120);
    }
    else { const dir = dx<0?"left":"right"; await gate(dir); await walkLeg(to,dir); await sleep(120); }
  }

  // --- the deciding turn: a road each way — one shot, no retry
  const side = await askAt();
  hideBubble();                              // the choice is made — ONLY now does the instruction panel bow out
                                             // (picks at earlier jog turns leave it up on purpose)
  const isLeft = side==="left";
  const P = LEVEL.paths[side];
  const correct = (side===target);
  const names = correct ? P.go : P.bark;       // wrong house → same way, but stop at the plot edge, never close to the door
  const hf = feetOf(WP[names[names.length-1]]);
  for(let i=0;i<names.length;i++) await stepTo(names, i, correct);

  // arrived — Byte turns to the house, parcel in hand (no call-out: the instruction panel stays clean)
  const O=LEVEL.houses[side].dogOut;
  setByte(O.road.x>hf.x ? "rightParcel" : "leftParcel", hf.x, hf.y);
  await sleep(450);
  sfxDoorOpen(); setHouse(side, "open");        // the door opens — synced to the open sound
  await sleep(300);

  if(correct){
    await dogCatchScene(side, hf);              // dog hops out, Byte hands over the parcel, dog catches it & carries it inside
    await houseHappy(side);                     // the house does a joyful little hop
    await houseClose(side);                     // door shuts
    confetti(); byteAnim.classList.add("cheer");   // confetti — the clap follows the VO inside showDelivered
    await showDelivered(side);                  // "Delivered! ✓" bubble over the house
    byteAnim.classList.remove("cheer");
    await walkPath(P.exit, false);              // walk off-frame after delivering
  } else {
    // wrong house — the dog barks from the doorway; Byte keeps his distance at the plot edge.
    // No big "Oh no!" text: the incorrect sound plays, and once it ends the dog goes back
    // inside and Byte carries the parcel on out of the frame along this same road.
    await dogBarkScene(side);                      // dog appears in the doorway and barks
    await houseClose(side);                        // the dog goes back in and the door shuts behind it
    voSay("wrong-delivery");                       // voiced with the badge
    await showHouseBadge(wrongBadge, side);        // "Oops! Wrong Delivery! ✗" over the house — no panel text
    await walkPath(P.exit, true);                  // Byte goes on his way, parcel still in hand
  }
  // EVERY level must be DELIVERED before the run moves on: a missed delivery replays the
  // SAME level — same map, freshly-dealt house colours (pickColors in nextRound guarantees
  // a new pair) — until the parcel lands. The mission can therefore only ever be
  // accomplished with all parcels delivered; the route board never carries a failed stop.
  if(!correct){ busy=false; nextRound(levelIdx); return; }
  // the parcel is delivered — log the level and show the board.
  // (a retry above returns first: nothing has changed there, so the beat would be a dead stop)
  routeState[levelIdx] = "done";
  await showRoute(levelIdx);
  if(levelIdx+1 >= LEVELS.length){ endGame(); busy=false; return; }
  busy=false; nextRound(levelIdx+1);
}
let endBtnShown=false, endBtnTimer=null, endBtnGuard=null;
/* Lastscreen.webm cuts scenes at exactly 2.95s and 28s — the two beats the end flow hangs off:
     0–2.95s   "MISSION ACCOMPLISHED!" banner (its own audio speaks the line)
     2.95–28s  Byte's dance
     28–33s    "BYTE SAVED THE DAY" card (its own audio is silent from here) */
const MISSION_CARD_T=2.8;                          // a beat BEFORE the 2.95 cut, so the pause holds on the banner rather than the dance's first frame
const END_CARD_T=28;                               // the dance has played out by here and the video's narration goes silent — the closing card lands
let endVoBreak=false;                              // true while the video is deliberately paused for the "Let's celebrate" line
function revealEndBtn(delay=0){                    // NEXT stays hidden through the dance — it only pops on the closing card, with its VO
  if(endBtnShown) return; endBtnShown=true;
  clearTimeout(endBtnTimer);
  endBtnTimer=setTimeout(()=>{ endBtn.classList.add("show"); sfxPop(); }, delay);
}
/* The pause between the banner and the dance: the video freezes on "MISSION ACCOMPLISHED",
   "Let's celebrate!" plays clean over it, and only then does the dance roll. */
async function celebrateBreak(){
  endVoBreak=true;
  try{ endVideo.pause(); }catch(e){}
  await voSay("lets-celebrate");                   // resolves on the line's end (or its safety net)
  endVoBreak=false;
  if(endScreen.classList.contains("hide")) return; // player already hit NEXT / replayed — don't wake a dead screen
  try{
    const p=endVideo.play();
    if(p&&p.catch) p.catch(()=>revealEndBtn(600)); // couldn't resume → make sure there's still a way forward
  }catch(e){ revealEndBtn(600); }
}
async function endGame(){
  runActive=false;                                // run finished — NEXT may re-enter the classic flow
  stopLook();
  endBtnShown=false; endBtn.classList.remove("show");   // stays hidden until Byte's dance is over and the closing card lands
  clearTimeout(endBtnTimer); clearTimeout(endBtnGuard);   // a replay must not inherit last run's pending reveal
  endVoBreak=false;
  voSay("great-job");                           // owns the cloud sweep — the video (and its audio) waits until the clouds part
  await cloudTransition("Great job!", ()=>{     // clouds cover the map, the end screen appears underneath — label matches the VO ("Great job")
    gameScreen.classList.add("hide");
    endScreen.classList.remove("hide");
    routeHide();                                  // the full board was the last thing on screen — clear it behind the clouds
    stopMusic();                                // the video takes over — fade the background track out
    try{                                          // rewind WHILE hidden — on a replay the element still holds last run's final frame
      endVideo.loop=false;                        // celebration plays ONCE — never loop back to the start
      endVideo.onended=()=>{ try{ endVideo.pause(); endVideo.currentTime=Math.max(0, endVideo.duration-0.05); }catch(e){} revealEndBtn(); };  // hold on the last frame; backstop in case the 28s tick was missed
      // The video drives the two VO beats. ontimeupdate ticks ~4×/s, so each fires once via its own latch.
      let saidCelebrate=false, saidClosing=false;
      endVideo.ontimeupdate=()=>{
        const t=endVideo.currentTime;
        // "Let's celebrate!" — the banner card has had its say; hold on it for the line, THEN let the dance start
        // (the upper bound means a seek PAST the banner — e.g. the DEV "END ⏩" jump — skips the break instead of
        //  stopping the video mid-dance for a line whose moment has gone)
        if(!saidCelebrate && t>=MISSION_CARD_T){ saidCelebrate=true; if(t<MISSION_CARD_T+2.5) celebrateBreak(); }
        // closing VO — the video's own narration falls silent at 28s, right as its "BYTE SAVED THE DAY" card lands.
        // NEXT rides in with that line: the dance is done, so the button can't cut it short.
        if(!saidClosing && t>=END_CARD_T){ saidClosing=true; voSay("byte-saved-the-day"); revealEndBtn(900); }
      };
      endVideo.currentTime=0; endVideo.muted=false;
    }catch(e){}
  });
  // clouds have parted — the "Mission Accomplished" opening frame is on screen
  confetti(endScreen);                            // confetti rains down over the revealed end screen
  sfxWin();
  await sleep(450);                               // a breath on the banner before its narration starts — the screens don't pile up
  try{
    const p=endVideo.play();
    if(p&&p.catch) p.catch(()=>{ endVideo.muted=true; const q=endVideo.play(); if(q&&q.catch) q.catch(()=>revealEndBtn(1200)); });  // audio blocked → keep the visuals; can't play at all → don't trap the player behind a dead screen
  }catch(e){ revealEndBtn(1200); }
  // NEXT is now driven by the video itself (the 28s card / onended). Backstop: poll for progress and
  // only step in when playback has genuinely stalled or died — a slow decode must not cut the dance short,
  // but a dead one must never leave the end screen with no way forward. (A backgrounded tab just waits.)
  endVideo.onerror=()=>revealEndBtn(600);
  let lastT=-1;
  (function guardTick(){
    endBtnGuard=setTimeout(()=>{
      if(endBtnShown) return;
      const t=endVideo.currentTime;
      if(endVoBreak){ lastT=t; return guardTick(); }                                   // paused on purpose for the VO — not a stall
      if(endVideo.error || (t===lastT && !document.hidden)) return revealEndBtn(600);   // no progress → stalled
      lastT=t; guardTick();                                                            // still advancing → let it play out
    }, 6000);
  })();
}

/* ===================== Controls ===================== */
function ensureAudio(){ try{ if(!actx) actx=new (window.AudioContext||window.webkitAudioContext)(); if(actx.state==="suspended") actx.resume();
  // Route the bgm through a GainNode ONCE — this is what makes MUSIC_VOL / MUSIC_DUCK
  // real on iOS (el.volume is ignored there). The node owns the level from here on, so
  // the element volume goes to 1 — never both, or desktops would attenuate twice.
  if(actx && !bgmGain){
    try{ const s=actx.createMediaElementSource(bgm); bgmGain=actx.createGain();
      bgmGain.gain.value=musicLevel; s.connect(bgmGain).connect(actx.destination); bgm.volume=1;
    }catch(e){ bgmGain=null; }
  }
}catch(e){} }
/* best-effort landscape lock for touch devices — works on Android (needs fullscreen first);
   iOS has no lock API, so the #rotateOverlay media query covers it there */
async function lockLandscape(){
  try{
    if(matchMedia("(pointer:coarse)").matches && screen.orientation && screen.orientation.lock){
      if(document.documentElement.requestFullscreen) await document.documentElement.requestFullscreen();
      await screen.orientation.lock("landscape");
    }
  }catch(e){}   // unsupported / denied → the rotate overlay still guards portrait play
}
$("startBtn").addEventListener("click", ()=>{ ensureAudio(); lockLandscape(); sfxClick(); welcomeThenStart(); });
/* NEXT — replays the whole game from level 1 (welcomeThenStart resets it; runActive is false here) */
endBtn.addEventListener("click", ()=>{ if(busy) return; ensureAudio(); sfxClick(); endBtn.classList.remove("show"); endBtnShown=false; welcomeThenStart(); });
function pick(side){                       // every way of answering funnels through here
  const btn = side==="left" ? leftBtn : rightBtn;
  if(busy || btn.disabled || !pendingPick) return;
  ensureAudio(); sfxClick();               // button tap sound
  btn.classList.add("picked");             // the chosen button pulses big as the pair fades out
  const res=pendingPick; pendingPick=null;
  busy=true; showButtons(false);
  res(side);                               // hands the answer back to the level flow
}
leftBtn.addEventListener("click", ()=>pick("left"));
rightBtn.addEventListener("click",()=>pick("right"));
document.addEventListener("keydown", e=>{
  if(e.key==="ArrowLeft")  pick("left");
  if(e.key==="ArrowRight") pick("right");
});
/* cross-browser backstop for the native image-drag (Firefox ignores -webkit-user-drag):
   the game has no legitimate drag, so cancel every drag before it can lift an image off */
document.addEventListener("dragstart", e=>e.preventDefault());
/* houses are just playful to tap (a happy jiggle) — answering happens ONLY via the Left/Right buttons */
function houseTap(side){
  ensureAudio();
  const el = side==="left" ? houseLeft : houseRight;
  el.classList.remove("bounce"); void el.offsetWidth; el.classList.add("bounce"); sfxPop();
  setTimeout(()=>el.classList.remove("bounce"), 500);
}
houseLeft.addEventListener("pointerdown", ()=>houseTap("left"));
houseRight.addEventListener("pointerdown",()=>houseTap("right"));
/* poke Byte → a happy little hop (pause the idle breathe so the hop always shows) */
byteWrap.addEventListener("pointerdown", ()=>{
  if(busy) return; ensureAudio(); sfxBoing();
  const wasIdle=byteAnim.classList.contains("idle");
  byteAnim.classList.remove("idle","cheer"); void byteAnim.offsetWidth; byteAnim.classList.add("cheer");
  setTimeout(()=>{ byteAnim.classList.remove("cheer"); if(wasIdle) byteAnim.classList.add("idle"); }, 620);
});

/* ===================== Preload gate =====================
   Hold Play inert until the essentials are actually decoded/buffered, so the background map
   and the opening voice-over never pop in late after the clouds open. The scene preloader above
   warms the houses/dog/parcel; this adds the map itself, the background music, and the opening
   voice lines (Audio elements only fetch when nudged), then flips Play live. A hard timeout
   guarantees the player is never trapped behind a single stalled/404'd asset. */
(function preloadGate(){
  const btn=$("startBtn");
  const imgs=["Assets/Background.webp","Assets/UI/start-screen.webp",
    "Assets/Byte/stand-back-parcel.webp","Assets/Byte/walk-up-parcel.webp","Assets/Byte/walk-side-parcel.webp",
    /* the road tiles paint as DIV background-images inside the hidden gameScreen, so nothing
       fetches them until Play un-hides it — on a cold cache they used to pop in AFTER the
       clouds parted (bare grass, then roads). Decode them behind the gate like the map. */
    "Assets/Roads/straight.webp","Assets/Roads/bend.webp","Assets/Parcel.webp",
    ...Object.keys(COLOR_NAME).flatMap(c=>["","open"].map(v=>houseFile(c,v)))];
  const auds=[bgm, VO["help-byte"], VO["deliver-the-parcels"],
    VO["deliver-red"], VO["deliver-blue"], VO["deliver-yellow"]];
  let pending=imgs.length+auds.length, settled=false;
  const release=()=>{ if(settled) return; settled=true; btn.classList.remove("loading"); btn.disabled=false; };
  const one=()=>{ if(settled) return; if(--pending<=0) release(); };
  btn.disabled=true; btn.classList.add("loading");
  imgs.forEach(src=>{ const im=new Image();
    if(im.decode){ im.src=src; im.decode().then(one,one); } else { im.onload=im.onerror=one; im.src=src; } });
  auds.forEach(a=>{ let fired=false; const go=()=>{ if(fired)return; fired=true; one(); };
    a.addEventListener("canplaythrough",go,{once:true}); a.addEventListener("error",go,{once:true});
    try{ a.load(); }catch(e){ go(); } });
  setTimeout(release, 6000);   // never trap the player behind a stalled asset
})();

/* initial placement — build the level map (field + tiled roads + house geometry), then park Byte */
(function(){
  loadLevel(START_LVL); const sf=feetOf(WP.start); setByte("backParcel", sf.x, sf.y);
})();

/* FIRST-SWEEP WARM-UP — paint the assembled cloud curtain once, invisibly, while the learner
   is still on the start screen (see the #fieldCurtain.warm CSS note: SVG backgrounds raster at
   element size on first paint, and doing ~60 of those at tablet DPI inside the Play sweep was
   the freeze-then-blue-flash). Runs at idle, once, and only if a real sweep hasn't started —
   a real sweep IS the warm-up if it gets there first. */
(function warmFirstSweep(){
  const fc=document.getElementById("fieldCurtain");
  let done=false;
  const warm=()=>{
    if(done) return; done=true;
    if(fc.classList.contains("show") || busy || runActive) return;   // a real sweep beat us to it
    fc.classList.add("warm");
    requestAnimationFrame(()=>requestAnimationFrame(()=>{
      fc.classList.remove("warm");
      /* Same trick for the PLAYSCREEN: it boots display:none, so its first-ever raster
         (full-frame map + roads + houses at device DPI) used to land inside the Play
         sweep's cover frame. Paint it once here instead — it sits UNDER the opaque
         start screen, and opacity .001 keeps it invisible against any gap. */
      if(busy || runActive || startScreen.classList.contains("hide")) return;
      gameScreen.style.opacity=".001";
      gameScreen.classList.remove("hide");
      requestAnimationFrame(()=>requestAnimationFrame(()=>{
        gameScreen.classList.add("hide");
        gameScreen.style.opacity="";
      }));
    }));
  };
  if("requestIdleCallback" in window) requestIdleCallback(warm,{timeout:2500});
  else setTimeout(warm,1200);
})();

/* ---- Flipbook embed hooks ----
   Publish what the embed bridge needs (plus read-only views of the run state), then announce
   that boot has finished. The bridge attaches to these and nothing else, so the game keeps
   working standalone exactly as before. */
window.__lbd = { playBtn: $("startBtn"), startScreen, endScreen, endVideo, endBtn, VO, bgm,
  get levelIdx(){ return levelIdx; }, get runActive(){ return runActive; },
  get awaitingPick(){ return !!pendingPick; } };
window.dispatchEvent(new Event("lbd:boot"));
</script>
<script src="embed-bridge.js"></script>
</body>
